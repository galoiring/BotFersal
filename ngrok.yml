version: "2"
authtoken: 2jEbwuS5OkY9Jn2Z5RSO9at3uIN_7A8uH8xKMtjExoejCUi44

tunnels:
  botfersal:
    addr: localhost:8000
    proto: http
    schemes: [https, http]
    inspect: false
    # Headers to suppress browser warning
    request_header:
      remove:
        - "user-agent"
      add:
        - "user-agent: BotFersal-App"
        - "ngrok-skip-browser-warning: true"
    response_header:
      add:
        - "ngrok-skip-browser-warning: true"
        - "x-frame-options: SAMEORIGIN"
    host_header: localhost:8000
