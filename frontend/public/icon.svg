<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- White background -->
  <rect width="512" height="512" rx="80" fill="white"/>
  
  <!-- Orange/Red card sticking out -->
  <rect x="180" y="80" width="240" height="160" rx="20" fill="#FF5722" transform="rotate(-5 300 160)"/>
  
  <!-- Main green wallet body -->
  <rect x="100" y="160" width="280" height="240" rx="25" fill="#4CAF50"/>
  
  <!-- Wallet fold/snap area -->
  <rect x="320" y="220" width="60" height="120" rx="15" fill="#2E7D32"/>
  
  <!-- White snap button -->
  <circle cx="350" cy="280" r="16" fill="white"/>
  
  <!-- Card detail on orange card -->
  <rect x="200" y="100" width="180" height="6" rx="3" fill="#D84315" transform="rotate(-5 290 103)"/>
  <rect x="200" y="115" width="120" height="4" rx="2" fill="#D84315" transform="rotate(-5 260 117)"/>
  
  <!-- Wallet inner shadow for depth -->
  <rect x="100" y="160" width="280" height="240" rx="25" fill="url(#shadow)" opacity="0.3"/>
  
  <defs>
    <linearGradient id="shadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E7D32;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>