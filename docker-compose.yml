version: "3.8"

services:
  mongodb:
    image: mongo:7
    container_name: botfersal-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=bot_fersal
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  botfersal:
    build: .
    container_name: botfersal-app
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PYTHONUNBUFFERED=1
      - MONGO_CONNECTION_STRING=mongodb://mongodb:27017/bot_fersal
    volumes:
      - ./logs:/app/logs
      - ./temp:/app/temp
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ngrok:
    image: ngrok/ngrok:latest
    container_name: botfersal-ngrok
    restart: unless-stopped
    network_mode: host
    command:
      - "start"
      - "--all"
      - "--config"
      - "/etc/ngrok.yml"
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml:ro
    depends_on:
      botfersal:
        condition: service_healthy

volumes:
  mongodb_data:
